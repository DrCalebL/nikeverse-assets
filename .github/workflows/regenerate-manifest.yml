name: Regenerate buybot manifest

# Runs whenever files are added, removed, or renamed under buybot/regular
# or buybot/whales. Path filter deliberately excludes buybot/manifest.json
# itself so the auto-commit doesn't re-trigger the workflow.

on:
  push:
    branches: [main]
    paths:
      - 'buybot/regular/**'
      - 'buybot/whales/**'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate manifest from disk
        run: |
          node -e '
          const fs = require("fs"), p = require("path");
          const list = (d) =>
            fs.readdirSync(p.join("buybot", d))
              .filter(f => /\.(png|jpe?g|gif)$/i.test(f))
              .sort()
              .map(f => `${d}/${f}`);
          const manifest = {
            $schema: "https://json-schema.org/draft/2020-12/schema",
            description: "Asset manifest for the NikePig buy bot. Auto-regenerated by .github/workflows/regenerate-manifest.yml on changes to regular/ or whales/.",
            version: 2,
            regular: list("regular"),
            whales: list("whales"),
          };
          fs.writeFileSync("buybot/manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log("Regenerated: " + manifest.regular.length + " regular + " + manifest.whales.length + " whales");
          '

      - name: Commit + push if manifest changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain buybot/manifest.json)" ]]; then
            git add buybot/manifest.json
            git commit -m "chore(buybot): auto-regenerate manifest [skip ci]"
            git push
          else
            echo "Manifest already in sync; nothing to commit."
          fi
