name: Regenerate buybot manifest

# Runs whenever files are added, removed, or renamed under buybot/regular
# or buybot/whales. Path filter deliberately excludes buybot/manifest.json
# itself so the auto-commit doesn't re-trigger the workflow.

on:
  push:
    branches: [main]
    paths:
      - 'buybot/regular/**'
      - 'buybot/nice/**'
      - 'buybot/whales/**'

permissions:
  contents: write

# Serialize runs so two near-simultaneous uploads never race on `git push`.
# A second push queues behind the first instead of being cancelled.
concurrency:
  group: regenerate-manifest
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate manifest from disk
        run: |
          set -euo pipefail
          node -e '
          const fs = require("fs"), p = require("path");
          const list = (d) => {
            const dir = p.join("buybot", d);
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir)
              .filter(f => /\.(png|jpe?g|gif)$/i.test(f))
              .sort()
              .map(f => `${d}/${f}`);
          };
          const manifest = {
            $schema: "https://json-schema.org/draft/2020-12/schema",
            description: "Asset manifest for the NikePig buy bot. Auto-regenerated by .github/workflows/regenerate-manifest.yml on changes to regular/, nice/, or whales/.",
            version: 3,
            regular: list("regular"),
            nice: list("nice"),
            whales: list("whales"),
          };
          fs.writeFileSync("buybot/manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log("Regenerated: " + manifest.regular.length + " regular + " + manifest.nice.length + " nice + " + manifest.whales.length + " whales");
          '

      - name: Commit + push if manifest changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain buybot/manifest.json)" ]]; then
            echo "Manifest already in sync; nothing to commit."
            exit 0
          fi
          git add buybot/manifest.json
          git commit -m "chore(buybot): auto-regenerate manifest [skip ci]"
          # Rebase onto any commits that landed on main while we were
          # working, then push. Belt-and-braces alongside the concurrency
          # group above for the rare case of an external direct push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing and retrying."
            git pull --rebase origin main
          done
          echo "Push failed after retries." >&2
          exit 1
